<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nexam — Login</title>
    <meta name="theme-color" content="#1A2942">
    <link href="http://localhost/nexam/assets/css/fonts.css" rel="stylesheet" type="text/css">
    <link href="http://localhost/nexam/assets/css/auth.css" rel="stylesheet" type="text/css">
    <link href="http://localhost/nexam/assets/css/toast.css" rel="stylesheet" type="text/css">
    <link href="http://localhost/nexam/assets/css/modal.css" rel="stylesheet" type="text/css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-wrap">
        <!-- Left brand panel -->
        <div class="auth-panel">
            <div class="panel-badge">Student Portal</div>
            <div class="panel-title">Exam Builder <em>for educators</em></div>
            <p class="panel-tagline">Build Table-of-Specification aligned examinations from your own question bank.</p>

            <div class="panel-footer">
                <div class="panel-icon">
                    <i data-lucide="graduation-cap"></i>
                </div>
                <div class="panel-org">
                    nexam
                    <small>TOS-aligned examination builder</small>
                </div>
            </div>
        </div>

        <!-- Right form panel -->
        <div class="auth-form-wrap">
            <div class="auth-heading">
                <span class="auth-logo">
                    <span class="logo-mark"><i data-lucide="graduation-cap"></i></span>
                    <span>nexam</span>
                </span>
                <h1 class="gradient-text">Welcome back</h1>
                <p>Sign in to continue to your exam builder.</p>
            </div>

            <form action="http://localhost/nexam/login/authenticate" method="post" autocomplete="off">
                <input type="hidden" name="nexam_csrf_token" value="ac4b762c252fcc8ed1af5fa054b44c50">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail Address <span class="req">*</span></label>
                    <div class="input-wrap">
                        <span class="input-icon"><i data-lucide="mail"></i></span>
                        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password <span class="req">*</span></label>
                    <div class="input-wrap password-wrap">
                        <span class="input-icon"><i data-lucide="lock"></i></span>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" aria-label="Show password">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span class="btn-spinner"></span>
                    <span class="btn-label">Log In</span>
                </button>
                <a href="http://localhost/nexam/register" class="btn-register">
                    <i data-lucide="user-plus"></i>
                    Register
                </a>
            </form>

            <div class="form-links">
                <a href="http://localhost/nexam/forgot">Forgot password?</a>
            </div>
        </div>
    </div>

    <script src="http://localhost/nexam/assets/js/toast.js"></script>
    <script src="http://localhost/nexam/assets/js/modal.js"></script>
    <script src="http://localhost/nexam/assets/js/auth.js"></script>
        
</body>
</html>
<script>
window.addEventListener("load", function(){
  var out=[];
  var h1=document.querySelector(".auth-heading h1");
  var r=h1.getBoundingClientRect();
  out.push("h1 rect="+Math.round(r.width)+"x"+Math.round(r.height)+" text='"+h1.textContent.trim()+"'");
  out.push("icons rendered="+document.querySelectorAll("svg.lucide").length);
  out.push("unrendered <i data-lucide>="+document.querySelectorAll("i[data-lucide]").length);
  var logo=document.querySelector(".auth-logo");
  out.push("logo rect="+Math.round(logo.getBoundingClientRect().width)+"x"+Math.round(logo.getBoundingClientRect().height));
  // anything overflowing its parent or overlapping
  document.querySelectorAll(".auth-wrap *").forEach(function(el){
    var er=el.getBoundingClientRect();
    if(er.width===0&&er.height===0&&el.offsetParent!==null&&el.children.length===0&&el.textContent.trim())
      out.push("ZERO-SIZE: "+el.tagName+"."+el.className);
    if(el.scrollWidth>el.clientWidth+2 && getComputedStyle(el).overflowX!=="auto")
      out.push("OVERFLOW-X: "+el.tagName+"."+el.className+" ("+el.scrollWidth+">"+el.clientWidth+")");
  });
  var d=document.createElement("div"); d.id="R"; d.textContent=out.join(" ~ ");
  document.body.appendChild(d);
});
</script>
