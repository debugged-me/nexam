name: nexam_omr
description: "Nexam OMR — mobile companion for OMR answer-sheet scanning and score sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.2.0
  image: ^4.5.4
  camera: ^0.11.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
