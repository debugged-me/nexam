<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e8ecf3;
      }

      #root {
        --ink: #1a1d24;
        --blue: #2e7cd6;
        --blue-soft: #61a8ff;
        --silver-hi: #fbfcfe;
        --silver-lo: #dfe4ec;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
      }

      /* ——— silver studio backdrop ——— */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(130% 105% at 50% 22%, var(--silver-hi) 0%, #edf1f7 46%, var(--silver-lo) 100%);
      }

      /* ambient color glows — all motion is loop-periodic */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        will-change: transform, opacity;
      }
      .glow-blue {
        width: 1500px;
        height: 700px;
        left: 260px;
        top: -330px;
        background: rgba(46, 124, 214, 0.16);
      }
      .glow-orb {
        width: 620px;
        height: 620px;
        left: -180px;
        bottom: -300px;
        background: rgba(97, 168, 255, 0.10);
        filter: blur(110px);
      }
      .glow-orb-2 {
        width: 520px;
        height: 520px;
        right: -160px;
        top: 42%;
        background: rgba(148, 163, 184, 0.14);
        filter: blur(100px);
      }

      /* soft studio floor band */
      .floor {
        position: absolute;
        left: 0;
        right: 0;
        top: 66%;
        height: 34%;
        background: linear-gradient(180deg, rgba(148, 163, 184, 0) 0%, rgba(148, 163, 184, 0.12) 55%, rgba(120, 135, 158, 0.16) 100%);
      }

      /* ——— perspective stage ——— */
      .stage {
        position: absolute;
        inset: 0;
        perspective: 1500px;
      }
      .world {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }

      /* ——— screen cards ——— */
      .screen {
        position: absolute;
        left: 410px; /* card center lands at x = 1000 + rel·560 */
        top: 191px;
        width: 1180px;
        height: 698px;
        border-radius: 16px;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.05),
          0 24px 60px -18px rgba(30, 45, 70, 0.28);
        transform-style: preserve-3d;
        will-change: transform, opacity, filter;
      }

      /* minimal browser chrome strip */
      .chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 16px;
        background: linear-gradient(180deg, #fcfdff, #f4f6fa);
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      }
      .chrome .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d8dde6;
      }
      .chrome .dot:nth-child(1) { background: #f0b8b4; }
      .chrome .dot:nth-child(2) { background: #f3dcab; }
      .chrome .dot:nth-child(3) { background: #b9e3c1; }
      .chrome .url {
        flex: 1;
        margin: 0 90px;
        height: 20px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.045);
      }

      .shot {
        display: block;
        width: 100%;
        height: 664px;
        object-fit: cover;
        object-position: top center;
      }

      /* hero accent ring — opacity only, driven per advance */
      .ring {
        position: absolute;
        inset: 0;
        z-index: 3;
        border: 3px solid rgba(46, 124, 214, 0.65);
        border-radius: inherit;
        opacity: 0;
        pointer-events: none;
      }

      /* specular sheen band riding each card */
      .sheen {
        position: absolute;
        inset: -10%;
        z-index: 2;
        opacity: 0;
        background: linear-gradient(
          105deg,
          transparent 40%,
          rgba(255, 255, 255, 0.04) 46%,
          rgba(255, 255, 255, 0.5) 50%,
          rgba(255, 255, 255, 0.05) 55%,
          transparent 62%
        );
        pointer-events: none;
        will-change: transform, opacity;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: radial-gradient(118% 118% at 50% 42%, transparent 58%, rgba(20, 28, 44, 0.13) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-gxr6"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-wt31" id="stage-clip">
        <div data-hf-id="hf-m7dd" class="bg"></div>
        <div data-hf-id="hf-ceem" class="glow glow-blue" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-tlx3" class="glow glow-orb" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-sgz2" class="glow glow-orb-2" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-kk9u" class="floor"></div>

        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-pkbq" class="world" id="world">
            <!-- slots: D' A B C D A' B' C' — duplicated once so the rail wraps -->
            <article data-hf-id="hf-hbz8" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-6ex2" class="chrome"><span data-hf-id="hf-9gry" class="dot"></span><span data-hf-id="hf-zcc2" class="dot"></span><span data-hf-id="hf-zqn3" class="dot"></span><span data-hf-id="hf-yjmo" class="url"></span></div><img data-hf-id="hf-2qas" class="shot" src="assets/screens/exam-analytics.png" alt="" /><span data-hf-id="hf-oeap" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-ohjn" class="ring"></span></article>
            <article data-hf-id="hf-n1y4" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-ujgq" class="chrome"><span data-hf-id="hf-04y4" class="dot"></span><span data-hf-id="hf-0j95" class="dot"></span><span data-hf-id="hf-0xk6" class="dot"></span><span data-hf-id="hf-u2mw" class="url"></span></div><img data-hf-id="hf-6d4s" class="shot" src="assets/screens/dashboard.png" alt="" /><span data-hf-id="hf-61rp" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-qib7" class="ring"></span></article>
            <article data-hf-id="hf-lv11" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-uxrr" class="chrome"><span data-hf-id="hf-1bv7" class="dot"></span><span data-hf-id="hf-1q68" class="dot"></span><span data-hf-id="hf-vrkt" class="dot"></span><span data-hf-id="hf-svpt" class="url"></span></div><img data-hf-id="hf-2z0e" class="shot" src="assets/screens/tos-detail.png" alt="" /><span data-hf-id="hf-78os" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-q406" class="ring"></span></article>
            <article data-hf-id="hf-m9c2" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-vc2s" class="chrome"><span data-hf-id="hf-w5vu" class="dot"></span><span data-hf-id="hf-mnty" class="dot"></span><span data-hf-id="hf-m9ix" class="dot"></span><span data-hf-id="hf-ta0u" class="url"></span></div><img data-hf-id="hf-0sft" class="shot" src="assets/screens/exam-detail.png" alt="" /><span data-hf-id="hf-6udr" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-ppp5" class="ring"></span></article>
            <article data-hf-id="hf-o8v7" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-vqdt" class="chrome"><span data-hf-id="hf-ngg0" class="dot"></span><span data-hf-id="hf-n24z" class="dot"></span><span data-hf-id="hf-l2lu" class="dot"></span><span data-hf-id="hf-s33r" class="url"></span></div><img data-hf-id="hf-4lek" class="shot" src="assets/screens/exam-analytics-b.png" alt="" /><span data-hf-id="hf-81au" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-pbe4" class="ring"></span></article>
            <article data-hf-id="hf-on68" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-w4ou" class="chrome"><span data-hf-id="hf-koat" class="dot"></span><span data-hf-id="hf-lv7w" class="dot"></span><span data-hf-id="hf-lgwv" class="dot"></span><span data-hf-id="hf-shes" class="url"></span></div><img data-hf-id="hf-9x10" class="shot" src="assets/screens/dashboard-b.png" alt="" /><span data-hf-id="hf-7mzt" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-ox33" class="ring"></span></article>
            <article data-hf-id="hf-ng95" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-wizv" class="chrome"><span data-hf-id="hf-jhdq" class="dot"></span><span data-hf-id="hf-j32p" class="dot"></span><span data-hf-id="hf-96d9" class="dot"></span><span data-hf-id="hf-rahp" class="url"></span></div><img data-hf-id="hf-442q" class="shot" src="assets/screens/tos-detail-b.png" alt="" /><span data-hf-id="hf-8tww" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-ois2" class="ring"></span></article>
            <article data-hf-id="hf-nuk6" class="screen" data-layout-allow-overflow="true"><div data-hf-id="hf-wxaw" class="chrome"><span data-hf-id="hf-9koa" class="dot"></span><span data-hf-id="hf-9yzb" class="dot"></span><span data-hf-id="hf-adac" class="dot"></span><span data-hf-id="hf-rosq" class="url"></span></div><img data-hf-id="hf-epql" class="shot" src="assets/screens/exam-detail-b.png" alt="" /><span data-hf-id="hf-8flv" class="sheen" data-layout-allow-overflow="true"></span><span data-hf-id="hf-o4h1" class="ring"></span></article>
          </div>
        </div>

        <div data-hf-id="hf-q7bi" class="vignette"></div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var DURATION = 8;
        var PITCH = 560; /* px between slot centers */
        var CENTER = 1; /* slot index centered at t = 0 */
        var THROW = 0.3; /* fast whip phase (power4.out) */
        var CATCH = 0.34; /* long-tail settle (power2.out) */
        var HOPS = [1.55, 3.55, 5.55, 7.28]; /* advance start times */

        /* pose for a screen at signed distance `rel` from the centered slot */
        function pose(rel) {
          var a = Math.abs(rel);
          var sgn = rel === 0 ? 0 : rel / a;
          return {
            x: rel * PITCH,
            z: a === 0 ? 0 : a === 1 ? -120 : a === 2 ? -240 : -360,
            rotationY: a === 0 ? 0 : sgn * (a === 1 ? 18 : a === 2 ? 30 : 36),
            scale: a === 0 ? 1 : a === 1 ? 0.9 : a === 2 ? 0.8 : 0.7,
            opacity: a === 0 ? 1 : a === 1 ? 0.78 : 0,
            brightness: a === 0 ? 1 : a === 1 ? 0.88 : 0.78,
            ring: a === 0 ? 1 : 0,
            sheenOpacity: a === 0 ? 0.32 : a === 1 ? 0.12 : 0,
            sheenX: -rel * 30,
          };
        }

        var root = document.querySelector('[data-composition-id="main"]');
        var world = document.getElementById("world");
        var screens = Array.prototype.slice.call(root.querySelectorAll(".screen"));
        var rings = screens.map(function (el) { return el.querySelector(".ring"); });
        var sheens = screens.map(function (el) { return el.querySelector(".sheen"); });
        var glowBlue = root.querySelector(".glow-blue");
        var orb1 = root.querySelector(".glow-orb");
        var orb2 = root.querySelector(".glow-orb-2");

        var tl = gsap.timeline({ paused: true });

        /* world pose: slight downward camera tilt owned entirely by GSAP */
        gsap.set(world, { rotationX: 3.5, transformOrigin: "50% 60%" });

        /* initial slot state: screen i sits at rel = i - CENTER */
        screens.forEach(function (el, i) {
          var p = pose(i - CENTER);
          gsap.set(el, {
            x: p.x,
            z: p.z,
            rotationY: p.rotationY,
            scale: p.scale,
            opacity: p.opacity,
            filter: "brightness(" + p.brightness + ")",
            transformOrigin: "50% 55%",
          });
          gsap.set(rings[i], { opacity: p.ring });
          gsap.set(sheens[i], { opacity: p.sheenOpacity, xPercent: p.sheenX });
        });

        /* advances — the softened velocity throw: whip then long-tail catch */
        HOPS.forEach(function (at, h) {
          var centered = CENTER + h + 1;
          screens.forEach(function (el, i) {
            var p = pose(i - centered);
            /* every hop moves exactly -PITCH: throw covers 90% (x1 + 56),
               then the catch lands the last fraction — no overshoot */
            tl.to(el, { x: p.x + 56, duration: THROW, ease: "power4.out" }, at);
            tl.to(el, { x: p.x, duration: CATCH, ease: "power2.out" }, at + THROW);
            tl.to(
              el,
              {
                z: p.z,
                rotationY: p.rotationY,
                scale: p.scale,
                opacity: p.opacity,
                filter: "brightness(" + p.brightness + ")",
                duration: THROW + CATCH,
                ease: "power2.inOut",
              },
              at
            );
            tl.to(rings[i], { opacity: p.ring, duration: 0.3, ease: "power1.out" }, at + THROW * 0.5);
            tl.to(sheens[i], { opacity: p.sheenOpacity, xPercent: p.sheenX, duration: THROW + CATCH, ease: "power2.inOut" }, at);
          });
        });

        /* ambient loop-periodic breathing — everything returns to its start pose */
        tl.to(world, { scale: 1.028, duration: DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.to(glowBlue, { scale: 1.14, opacity: 0.85, duration: DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.to(orb1, { x: 90, y: -34, duration: DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.to(orb2, { x: -70, y: 26, duration: DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
